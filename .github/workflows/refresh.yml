# .github/workflows/refresh.yml - SpeakersBureau scheduled dataset refresh and
# Cloudflare Pages deploy.
#
# THE SPLIT OF RESPONSIBILITIES, because it is not the obvious one.
#
# The SCHEDULE and the DATASET COMMIT still live on GitHub Actions, because that
# is what cron and `git push` are, and because a token pushing a commit back to
# the repository is what makes the deployed site auditable. Only the PUBLISH step
# moved to Cloudflare. So this is a GitHub workflow that deploys somewhere other
# than GitHub, which reads oddly and is deliberate.
#
# ONE WORKFLOW, TWO JOBS, AND THAT IS THE DESIGN DECISION MOST WORTH DEFENDING
# ---------------------------------------------------------------------------
# A failed feed must be RED and must NOT publish. `refresh` and `deploy` are two
# jobs in ONE workflow with `needs:`, so a feed failure skips the deploy and the
# Actions UI shows exactly that: red refresh, grey skipped deploy. There is no
# window in which a red run sits next to a green deployment reading as
# contradictory.
#
# The tempting alternative is two independent workflows: publish on every
# schedule regardless, keep the red one visible. Rejected, for one decisive
# reason: Cloudflare Pages RETAINS the last successful deployment, exactly as
# GitHub Pages did. A failed deploy leaves the previously published site live and
# serving. So a fetch failure does not take the site down, it merely fails to
# refresh it, and blocking the deploy costs exactly zero availability while
# buying a coherent signal. If the site has never been published at all (first
# run, and the first fetch fails), run the workflow manually and read the failure
# - that is the only case where a failure blocks the first publish, and a red
# action is the correct answer to it anyway.
#
# A second reason: after a failed refresh the dataset on disk is UNCHANGED, so a
# deploy would republish byte-identical content under a fresh deployment id and a
# fresh timestamp, implying a freshness that does not exist. That is the same lie
# design rule 3 exists to prevent, wearing a success badge.
#
# WHAT THE FETCH STEP IS, AND WHY NOTHING SUPPRESSES ITS EXIT CODE
# ------------------------------------------------------------------
# `npm run fetch` fetches every enabled feed in data/sources.yml, applies the
# three-part validation rule (XML content type, parses as XML, yields >= 1 item)
# and writes data/articles.json ATOMICALLY. It exits 1 if ANY feed fails and
# writes NOTHING. That is deliberate: the one failure mode that looks like
# success is a green build on yesterday's data.
#
# Therefore this step has no `|| true`, no `continue-on-error`, and no
# `--allow-partial`. Do not "fix" a red action by adding any of those. If it goes
# red, the answer is in the log: every run prints per-source status, resolved
# URL, item count, and the exact reason for any failure.
#
# CREDENTIALS: WHY A PAT AND NOT THE BUILT-IN GITHUB_TOKEN
# --------------------------------------------------------
# The push needs a credential and it cannot be implicit. `secrets.PAT_TOKEN` is a
# fine-grained personal access token owned by the repository owner, scoped to
# THIS repository only, with ONE permission: Contents -> Read and write. That is
# the minimum for `git push` of a commit. Workflows -> Write is NOT needed and
# NOT granted, because this workflow never edits its own definition. Account
# permissions (Administration, Secrets) are not needed.
# See docs/DEPLOY.md for the click-by-click creation steps.
#
# GITHUB_TOKEN would also be able to push, and that is the honest alternative.
# The PAT is used instead because it is independent of the repository's default
# workflow token permissions setting, it is scoped to one repo, and it does not
# expire with a single job run. `persist-credentials: true` (the checkout
# default, stated explicitly anyway) is what makes the credential usable by the
# later `git push`: checkout writes it into this clone's local git config, so no
# secret is ever passed on a command line or printed in the log.
# If branch rulesets are ever enabled, they must allow Actions to bypass, or the
# push is rejected - see docs/DEPLOY.md.
#
# CREDENTIALS FOR CLOUDFLARE: TWO SECRETS, NEITHER OF THEM A LOGIN
# --------------------------------------------------------
# Publishing needs `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`. Both are
# passed to the deploy job as environment variables, which is the interface
# wrangler reads them through. Neither is ever echoed, and neither appears on a
# command line where it would land in the log.
#
# The token is a scoped API token from the Cloudflare dashboard - not an account
# password, and not a Global API Key.
#
# THE PERMISSION IS "Workers Scripts > Edit", NOT "Cloudflare Pages > Edit", and
# this comment previously said the opposite. That was wrong, and following it
# would have produced a token that deploys nothing: `wrangler deploy` publishes
# a Worker, so Pages permissions do not apply to it at all. Cloudflare's own
# documented permission set for this command is Account > Workers Scripts (edit)
# plus Account > Account Settings (read), and the dashboard's "Edit Cloudflare
# Workers" template grants exactly that. The quickest way to get this right is to
# use that template rather than to hand-pick permissions.
#
# The token is restricted to the one account that owns this Worker. It cannot read
# DNS records and cannot read billing.
#
# The old comment claimed this permission "cannot reach Workers, KV or R2", which
# was self-contradictory: Workers Scripts > Edit IS reaching Workers, and reaching
# Workers is the entire point of the permission.
#
# WHY A TOKEN AND NOT THE OAUTH LOGIN. Wrangler can be logged in interactively
# with `wrangler login`, which is the right tool for a developer on a laptop. It
# stores a token in a config file on one machine, and a fresh ephemeral runner
# four times a day has no such file and cannot be handed one. An API token is the
# only credential a stateless runner can be given, and the only one that can be
# scoped down to a single permission.
#
# `CLOUDFLARE_ACCOUNT_ID` is not sensitive in the way the token is - it is an
# identifier, visible in the dashboard sidebar - but it is stored as a secret
# rather than a variable so that both halves of the credential live in one place
# and there is a single list to check when rotating.

name: refresh

on:
  schedule:
    # Every 6 hours. Minute 17, not 0: every scheduled workflow on GitHub that
    # fires on the hour queues against the same infrastructure, so an off-hour
    # minute starts faster and jitter-spreads the load.
    #
    # The interval was widened from every 4 hours to every 6 hours. That is a
    # measured response to rate limiting on the fetch - the scheduled runs were
    # being refused with HTTP 429 - and not a preference for a slower site.
    # Requesting less often is the fix that does not move the architecture.
    # Those are four runs a day rather than six.
    #
    # The minute-of-hour reason above is a SEPARATE thing and is not part of the
    # interval change. It is about how quickly the job STARTS, not how many
    # requests it makes, so widening the interval neither depends on it nor
    # weakens it. Minute 17 stays.
    - cron: '17 */6 * * *'
  # A push to the branch publishes. This is the trigger that makes the everyday
  # answer to "I changed something" be `git push` and nothing else - no waiting
  # up to six hours for the schedule, and no manual run from the Actions tab.
  #
  # It runs the FULL pipeline, fetch included, rather than deploy-only, and that
  # is deliberate. A code change should not be able to publish a dataset it never
  # checked, and a change to the fetch rules should not need two triggers. It
  # also means the "a failed feed must not publish" guarantee below applies to
  # your own commits, not only to the timer.
  push:
    branches:
      - main
  # Manual trigger. Same path, same guards, no arguments - the workflow has no
  # modes that could differ from the scheduled one and quietly do something else.
  workflow_dispatch:

# Two runs must never race to push the same dataset. Same group, so the second
# run queues behind the first. cancel-in-progress is FALSE on purpose: cancelling
# a run that is midway through its push is worse than waiting. The scheduled run
# is the one that should yield, and GitHub queues rather than cancels here.
concurrency:
  group: refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default. The refresh job widens this to contents: write for
# exactly one reason: committing the dataset.
permissions:
  contents: read

jobs:
  refresh:
    name: fetch and commit dataset
    # Not for pull requests at all (a fork PR has no write token, and running a
    # network fetch and a push on PR data is not wanted), and never from a fork.
    if: github.event_name != 'pull_request' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Explicit ref. On a schedule this is the default branch; on a manual
          # run it is whichever branch was selected, and the dataset is pushed
          # back to that same branch, never silently to main.
          ref: ${{ github.ref_name }}
          # fetch-depth 0 is more than strictly needed: depth 1 would still have
          # HEAD, which is all the diff below requires. Full history is taken
          # because this job CREATES a real commit in that history, and because
          # `git log` over the dataset commits is the answer to "why is this
          # article on the site" that ROADMAP promises. It costs seconds.
          fetch-depth: 0
          # See the credential note above. Without this the later push has no
          # credential to use.
          persist-credentials: true
          # `secrets.PAT_TOKEN || github.token` IS LOAD-BEARING, and the fallback
          # is the whole point. An absent secret expands to an EMPTY STRING, and
          # actions/checkout treats an explicitly-supplied empty `token` as "a
          # token was required and none was given" - a hard failure at the FIRST
          # step. Measured, not assumed: the first run of this workflow on
          # 2026-10-06 died in 5 seconds at checkout with exactly that error,
          # before the fetcher, the build or the deploy had run a single line.
          #
          # That is the wrong place to fail. Reading the repository needs no
          # secret at all - GITHUB_TOKEN always has it - so when PAT_TOKEN is
          # missing, fall back to GITHUB_TOKEN and let checkout succeed. The job
          # then fetches, builds and deploys normally, and the ONE thing that
          # genuinely needs the PAT - committing the refreshed dataset - fails
          # later, at the step that already exists to say so in plain words.
          #
          # With no PAT_TOKEN you therefore lose the ability to SAVE new
          # articles, and keep the ability to publish code changes. Failing at
          # checkout instead would lose both, over a secret that only one step
          # uses. When PAT_TOKEN IS set, this expression is exactly what it was
          # before.
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: set up node
        uses: actions/setup-node@v4
        with:
          # 24 is the version this project is developed and built on locally
          # (v24.21.0); package.json only requires >=22. Quoted so YAML keeps it
          # a string and the runner resolves the newest 24.x rather than a
          # floating number.
          node-version: '24'
          # npm cache keyed on the lockfile. Cuts a minute or more off every run,
          # which matters for a job that runs four times a day.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install dependencies
        run: npm ci
        # npm ci, not npm install: it installs exactly the lockfile and fails if
        # package.json and package-lock.json disagree. A scheduled build that
        # silently resolves a new version is a build you cannot reproduce.

      - name: require the feed egress credential
        # Added 2026-10-07, and it exists because of a measured failure rather
        # than a hypothetical one.
        #
        # GitHub's Actions runners CANNOT read these feeds. Every feed answers
        # HTTP 403 with `cf-mitigated: challenge` and a body titled "Just a
        # moment..." from that network, on every User-Agent including a desktop
        # browser string, while example.com answers 200 from the same runner in
        # 172ms. That is Cloudflare's Managed Challenge refusing GitHub's Azure
        # egress range - not a Substack block, not a UA filter, and therefore
        # not fixable by changing a header or adding retries.
        #
        # So the fetch is relayed through a small Worker on Cloudflare egress,
        # which answers 200 in 28-135ms. This step checks the one secret that
        # relay needs, and does it HERE rather than letting the fetch fail three
        # steps later. A missing secret should read as a missing secret, which is
        # the same rule the other two credential guards in this file follow.
        run: |
          if [ -z "${{ secrets.FEED_EGRESS_TOKEN }}" ]; then
            echo "::error::FEED_EGRESS_TOKEN repository secret is not set, so the feeds cannot be read. GitHub's runner network is refused by Cloudflare's managed challenge, so this fetch must go through the feed-egress Worker. See docs/DEPLOY.md."
            exit 1
          fi
          echo "Feed egress credential is present."

      - name: fetch feeds (fail loud)
        env:
          # The Worker that relays the request. It moves bytes and decides
          # nothing: all parsing, validation and retry policy stay in scripts/,
          # where they are covered by the test suite. See
          # workers/feed-egress/worker.js for why it refuses to parse anything.
          FEED_EGRESS_URL: https://sb-feed-egress.mstricklandtech.workers.dev
          # Never interpolated into the command line. An `env:` block is what
          # keeps it out of the log.
          FEED_EGRESS_TOKEN: ${{ secrets.FEED_EGRESS_TOKEN }}
        run: npm run fetch
        # No continue-on-error. No `|| true`. No --allow-partial. A non-zero exit
        # here is the design working: the run goes red, nothing is committed,
        # and the deploy job below is skipped.
        #
        # Setting FEED_EGRESS_URL is the ONLY change to this step. Unset, the
        # fetcher uses the network directly and behaves exactly as it always
        # did - which is what still lets it run on a laptop, where the direct
        # path works fine.

      - name: measure what actually changed in the dataset
        id: dataset
        env:
          PREV: ${{ runner.temp }}/prev-articles.json
        run: |
          # The committed copy, for comparison.
          git show HEAD:data/articles.json > "$PREV"
          # generatedAt is a fresh ISO timestamp on every single run, so the file
          # is BYTE-DIFFERENT every 6 hours no matter what the feeds did. A plain
          # `git diff --quiet` therefore NEVER says "unchanged" and would commit
          # a one-line timestamp bump forever, which is the empty-commit churn
          # this job exists to avoid. So the comparison below drops generatedAt
          # and asks a real question: did the CONTENT change?
          node -e '
            const fs = require("node:fs");
            // Recursive key sort, so a reordering of object keys is not
            // mistaken for a content change.
            const stable = (v) => {
              if (Array.isArray(v)) return v.map(stable);
              if (v && typeof v === "object") {
                const out = {};
                for (const k of Object.keys(v).sort()) out[k] = stable(v[k]);
                return out;
              }
              return v;
            };
            const strip = (path) => {
              const doc = JSON.parse(fs.readFileSync(path, "utf8"));
              const ids = Array.isArray(doc.articles) ? doc.articles.map((a) => a.id) : [];
              delete doc.generatedAt;
              return { doc: doc, ids: ids };
            };
            const prev = strip(process.env.PREV);
            const now = strip("data/articles.json");
            const prevIds = new Set(prev.ids);
            const nowIds = new Set(now.ids);
            const added = now.ids.filter((id) => !prevIds.has(id));
            const removed = prev.ids.filter((id) => !nowIds.has(id));
            const sameContent =
              JSON.stringify(stable(prev.doc)) === JSON.stringify(stable(now.doc));
            const changed = !sameContent;
            const out = process.env.GITHUB_OUTPUT;
            const put = (k, v) => fs.appendFileSync(out, k + "=" + String(v) + "\n");
            put("changed", changed);
            // Counts are real, computed by diffing article ids between the
            // committed dataset and the fresh one. Nothing here is invented, and
            // a "0 added" run that changed a resolved URL still says changed.
            put("added", added.length);
            put("removed", removed.length);
            put("total", typeof now.doc.articleCount === "number" ? now.doc.articleCount : now.ids.length);
          '
        # Outputs: changed (true|false), added, removed, total.

      - name: discard the run when nothing changed
        # Restores the committed file so the tree is clean. Without this the
        # timestamp-only diff would sit there looking like a pending change.
        if: steps.dataset.outputs.changed != 'true'
        run: |
          git checkout -- data/articles.json
          echo "Dataset content unchanged (generatedAt moved, nothing else). No commit."

      - name: require the push credential
        # Fails loudly and specifically, instead of letting `git push` fail with
        # a generic authentication error eight steps later. Only reached when
        # there is genuinely something to commit.
        if: steps.dataset.outputs.changed == 'true'
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::error::PAT_TOKEN repository secret is not set, so the dataset cannot be committed. See docs/DEPLOY.md."
            exit 1
          fi

      - name: commit and push the dataset
        if: steps.dataset.outputs.changed == 'true'
        env:
          ADDED: ${{ steps.dataset.outputs.added }}
          REMOVED: ${{ steps.dataset.outputs.removed }}
          TOTAL: ${{ steps.dataset.outputs.total }}
        run: |
          # Identity is the repository owner's, NOT github-actions[bot]. Two
          # reasons: a bot-authored commit is excluded from the contributor
          # graph and can trip branch rules that are written to ignore bots, and
          # the commits stay attributable to the person who can actually act on
          # them. Change these two lines if the repo owner differs.
          git config user.name "Bloodfeather"
          git config user.email "mstricklandtech@gmail.com"
          git add data/articles.json
          # The message states only what the measure step computed from article
          # ids. No timestamp, no "update".
          git commit -m "data: refresh dataset (+${ADDED} added, -${REMOVED} removed, ${TOTAL} articles)"
          git push origin "HEAD:${{ github.ref_name }}"

  deploy:
    name: build and deploy to cloudflare workers
    # needs, not always(). A failed refresh skips this job, which is the whole
    # point of the decision documented at the top of this file.
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      # Reading the source for checkout. That is now the ONLY permission this job
      # needs, and the reduction is the point: publishing to GitHub Pages wanted
      # `pages: write` and `id-token: write`, because deploy-pages mints an OIDC
      # token that proves to GitHub that this workflow is the thing deploying.
      # Cloudflare does not use GitHub's OIDC at all, so both scopes are gone.
      # This job now holds strictly less authority than it did, and publishes to
      # a third party's infrastructure.
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Default depth 1 is right here: this job only needs the current tree.
          # It builds from the branch TIP, which - if the refresh job committed
          # and pushed - is the new commit. So what gets published is exactly
          # what is in git, which is the whole argument for committing the
          # dataset at all.
          persist-credentials: false

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install dependencies
        run: npm ci

      - name: require the cloudflare credentials
        # Same reasoning as the PAT_TOKEN guard in the refresh job, and for the
        # same reason: fail loudly and specifically here, rather than letting
        # wrangler fail three steps later with a message about a token it could
        # not find. A missing secret should read as a missing secret.
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set, so the site cannot be published. See docs/DEPLOY.md."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is not set. It is shown in the Cloudflare dashboard sidebar. See docs/DEPLOY.md."
            exit 1
          fi
          # There is deliberately NO check for a project name here. On the Pages
          # side of this file there was one, and it no longer applies: the Worker
          # name lives in wrangler.jsonc, committed, where a typo is reviewable
          # rather than buried in a settings page. Two sources of truth for one
          # name is worse than one source of truth and a code review.
          # The Worker name is NOT read out of wrangler.jsonc here on purpose. An
          # earlier version tried to echo it with a regex over the file, which
          # means parsing JSONC with a regular expression - and a config file
          # whose contents are checked by a guess is a config file that will one
          # day report a name it did not actually find. Wrangler reads the file
          # properly a few steps later; this step only checks that it is there.
          if [ ! -f wrangler.jsonc ]; then
            echo "::error::wrangler.jsonc is missing from the repository, so there is nothing telling wrangler which Worker to publish to or where the built site is. This file is committed on purpose."
            exit 1
          fi
          echo "Cloudflare credentials are present, and wrangler.jsonc is committed."

      - name: install wrangler (pinned)
        # PINNED, not `@latest` and not a floating range, for the same reason the
        # project uses `npm ci` rather than `npm install`: a scheduled build that
        # silently resolves a new version is a build that cannot be reproduced or
        # rolled back. When this is upgraded, upgrade it here on purpose.
        # 4.148.0 was the current release when the publish target moved to
        # Cloudflare; it requires Node >= 22, and this job runs 24.
        run: npm install -g wrangler@4.148.0

      - name: refuse to build with a subpath
        # Cloudflare Pages serves from the root of the domain. There is no
        # project-subpath deployment on this platform the way there was on GitHub
        # Pages, so the correct value of BASE_PATH is ALWAYS empty, and a non-empty
        # value is a mistake that produces a site which loads unstyled with every
        # asset 404ing.
        #
        # This used to be a `::warning::` because on GitHub Pages the workflow
        # genuinely could not tell a user site from a project site and refused to
        # guess. That ambiguity is gone: there is one correct answer here, so this
        # is now a hard failure rather than advice in a log nobody reads.
        run: |
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            echo "::error::Repository variable BASE_PATH is set to '${{ vars.BASE_PATH }}', but this site is deployed to Cloudflare Pages, which serves from the domain root. Every asset URL would be prefixed with a path that does not exist and the site would render unstyled. Delete the BASE_PATH repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          echo "BASE_PATH is unset, so astro.config.mjs uses the root. Correct for Cloudflare Pages."

      - name: build
        # BASE_PATH is deliberately NOT passed here. The step above has already
        # proved it is empty, and passing an empty variable is indistinguishable
        # at this point from not passing one. The build therefore takes astro's
        # own fallback, which is the same "/" - but now only because we checked.
        run: npm run build
        # astro build writes dist/. Its own non-zero exit fails the job; nothing
        # here needs to swallow it.

      - name: deploy to cloudflare workers
        env:
          # Secrets arrive as environment variables, never interpolated into the
          # command line. `echo ${{ secrets.X }}` would print the token into the
          # workflow log; an `env:` block does not.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy
        # ONE COMMAND, AND THE PROJECT NAME IS NOT IN IT.
        #
        # The name and the asset directory both come from wrangler.jsonc in the
        # repository. That is the right place for them, unlike the previous
        # arrangement where the Pages project name was a repository VARIABLE read
        # into a command line: the Worker name is now committed alongside the
        # build it describes, so the thing that could silently orphan a live site
        # by being mistyped is reviewable in a pull request rather than hidden in
        # a settings page.
        #
        # `wrangler deploy` publishes a static-assets Worker to PRODUCTION. There
        # is deliberately no --branch flag: on the Pages side of this file there
        # was, and it was wrong, because a branch name routes the deployment to a
        # PREVIEW url instead. See the note that used to sit there.
        #
        # --commit-dirty=true because the working tree IS dirty by design in this
        # job: the refresh job committed the dataset on the branch, and
        # `data/articles.json` carries a `generatedAt` that moves on every fetch.
        # Wrangler's default refuses to deploy a dirty tree, which here would mean
        # refusing to deploy for a reason that is the system working correctly.

# ---------------------------------------------------------------------------
# END. The single most important line in this file is `run: npm run fetch`
# with nothing added to it. If you ever find yourself tempted to add `|| true`,
# a continue-on-error, or --allow-partial to make a red action go green, read
# ROADMAP design rule 3 first. The green build on stale data is the failure mode
# this project was built to make impossible.
#
# THE THREE THINGS THIS FILE NOW NEEDS FROM A REPOSITORY, all in docs/DEPLOY.md:
#   secret   PAT_TOKEN                  - pushes the refreshed dataset back to git
#   secret   CLOUDFLARE_API_TOKEN       - publishes the built site
#   secret   CLOUDFLARE_ACCOUNT_ID      - says which Cloudflare account
#
# There is NO project-name setting, and that is the point. On the Pages side of
# this file the Worker name was a repository VARIABLE read into a command line;
# it is now `name` in wrangler.jsonc, committed beside the build it describes. A
# name that can silently orphan a live site by being mistyped belongs in code
# review, not in a settings page nobody opens.
#
# All three are checked by name in this file and all three fail with a message
# that names the missing setting, because a workflow that fails obscurely on a
# schedule four times a day is a workflow that stays broken for weeks.
# ---------------------------------------------------------------------------
